<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" fill="none">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Mark: nested chevrons suggesting compression creating space -->
  <g transform="translate(8, 12)">
    <!-- Outer chevron - wide, open = the "room" -->
    <path d="M24 4 L4 28 L24 52" stroke="#0f172a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Middle chevron - compressed inward -->
    <path d="M24 12 L10 28 L24 44" stroke="#f97316" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Inner chevron - most compressed -->
    <path d="M24 20 L16 28 L24 36" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Accent dot at the compression point -->
    <circle cx="24" cy="28" r="3" fill="url(#accent)"/>
  </g>

  <!-- Wordmark -->
  <text x="68" y="44" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="34" font-weight="700" fill="#0f172a" letter-spacing="-0.5">legroom</text>

  <!-- Tagline -->
  <text x="70" y="60" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" letter-spacing="0.3">context compression for LLM agents</text>
</svg>
