[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legroom"
dynamic = ["version"]
description = "Context compression proxy — reduces LLM context tokens while preserving meaning"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "tiktoken>=0.7.0",
    "pyyaml>=6.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
ml = [
    "onnxruntime>=1.19.0",
    "numpy>=1.26.0",
    "tokenizers>=0.20.0",
]
dev = [
    "build>=1.2.0",
    "mypy>=1.11.0",
    "pre-commit>=4.6.0",
    "pytest>=8.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.4.0",
]
server = [
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "uvicorn>=0.29.0",
]

[tool.setuptools.dynamic]
version = {attr = "legroom._version.__version__"}

[tool.setuptools.packages.find]
include = ["legroom*"]

[tool.setuptools.package-data]
legroom = ["py.typed"]

[project.scripts]
legroom = "legroom.integration.cli:main"
legroom-proxy = "legroom.integration.cli:run_proxy"
legroom-sdk = "legroom.integration.sdk_worker:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
files = ["legroom"]
ignore_missing_imports = true
follow_imports = "normal"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "SIM", "RUF"]
ignore = ["E501"]
