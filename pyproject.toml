[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legroom"
dynamic = ["version"]
description = "Context compression proxy — reduces LLM context tokens while preserving meaning"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "tiktoken>=0.7.0",
    "pyyaml>=6.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
ml = [
    "onnxruntime>=1.19.0",
    "numpy>=1.26.0",
    "tokenizers>=0.20.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
]
server = [
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "uvicorn>=0.29.0",
]

[tool.setuptools.dynamic]
version = {attr = "legroom._version.__version__"}

[tool.setuptools.packages.find]
include = ["legroom*"]

[project.scripts]
legroom = "legroom.cli:main"
legroom-proxy = "legroom.cli:run_proxy"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
