name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check legroom tests benchmarks
      - run: mypy legroom
      - run: pytest --cov=legroom --cov-report=term-missing
      - run: python -m build
      - run: python benchmarks/run_benchmark.py --json --repeat 1 > evaluation-smoke.json
