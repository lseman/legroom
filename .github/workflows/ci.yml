name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev
      - run: uv run ruff check legroom tests benchmarks
      - run: uv run mypy legroom
      - run: uv run pytest --cov=legroom --cov-report=term-missing
      - run: uv build
      - run: uv run python benchmarks/run_benchmark.py --json --repeat 1 > evaluation-smoke.json
